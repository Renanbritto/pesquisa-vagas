name: Monitor de Vagas (LinkedIn + Indeed -> Telegram)

on:
  schedule:
    # Executa a cada 30 minutos em minutos fora do pico (17 e 47) para máxima pontualidade no GitHub
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar varredura de vagas
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Persistir banco de dados SQLite (Commit de vagas já vistas)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f vagas.db || true
          git diff-index --quiet HEAD || git commit -m "chore: atualiza banco de vagas [skip ci]"
          git push || true
